[package]
name    = "rust-tui-template"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm   = { version = "0.29.0", features = ["serde", "event-stream", "bracketed-paste"] }
ratatui     = { version = "0.26.0", features = ["serde", "macros"]}
anyhow      = "1.0.97"
env_logger  = "0.11.9"
log         = "0.4.29"
directories = "6.0.0"
serde       = "1.0.228"
toml        = "1.1.2"
clap        = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
